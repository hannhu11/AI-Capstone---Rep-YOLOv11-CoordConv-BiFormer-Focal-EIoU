# Rep-YOLO11s-P2 Decoupled AFPN (4-Head High-Resolution PPE Detector)
nc: 7
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2-P2/4 (Micro-Scale Feature Map)
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]           # 9-P5/32
  - [-1, 2, C2PSA, [1024]]             # 10-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                 # 17
  - [[-1, 13], 1, Concat, [1]]                 # 18 cat head P4
  - [-1, 2, C3k2, [512, False]]                # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                 # 20
  - [[-1, 10], 1, Concat, [1]]                 # 21 cat head P5
  - [-1, 2, C3k2, [1024, True]]                # 22 (P5/32-large)

  - [16, 1, nn.Upsample, [None, 2, 'nearest']] # 23 upsample P3/8 -> P2/4
  - [[-1, 2], 1, Concat, [1]]                  # 24 cat backbone P2/4
  - [-1, 2, C3k2, [256, False]]                # 25 (P2/4-micro: 160x160, 128ch)

  - [[25, 16, 19, 22], 1, Detect, [nc]]        # 26 4-Head Detection Layer