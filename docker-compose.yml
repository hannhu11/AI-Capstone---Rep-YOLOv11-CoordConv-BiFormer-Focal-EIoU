
services:
  cctv-safety-edge:
    build:
      context: .
      dockerfile: Dockerfile
    image: rep-yolo11s-cctv:latest
    container_name: cctv_safety_surveillance_node
    restart: unless-stopped
    ports:
      - "${CCTV_PORT:-8080}:8000"
    volumes:
      - ./video_test:/app/video_test:ro
      - ./Output:/app/Output
      - ./snapshots:/app/snapshots
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./results:/app/results
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
